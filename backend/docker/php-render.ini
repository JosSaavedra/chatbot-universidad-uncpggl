; Ajustes de PHP para el contenedor de producción en Render Free.
expose_php = 0
display_errors = 0
log_errors = 1
memory_limit = 192M
post_max_size = 1M
upload_max_filesize = 1M
max_execution_time = 30

; El código es inmutable dentro del contenedor: no hay que comprobar timestamps.
opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
opcache.validate_timestamps = 0
