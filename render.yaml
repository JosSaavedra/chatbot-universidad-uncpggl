services:
  - type: web
    name: chatbot-uncpggl-api
    runtime: php
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: >-
      composer install --no-dev --optimize-autoloader &&
      touch database/database.sqlite &&
      php artisan migrate --force &&
      php artisan db:seed --force
    startCommand: php artisan serve --host=0.0.0.0 --port=$PORT
    healthCheckPath: /
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://chatbot-uncpggl-api.onrender.com
      - key: APP_KEY
        generateValue: true
      - key: LOG_CHANNEL
        value: stderr
      - key: PHP_CLI_SERVER_WORKERS
        value: "4"
      - key: FRONTEND_URL
        value: https://chatbot-universidad.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://chatbot-universidad.vercel.app
      - key: OPENAI_API_KEY
        sync: false
